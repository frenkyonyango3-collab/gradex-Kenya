<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#065f46">
<title>Login | GradeX Kenya</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 20px; font-family: Arial, sans-serif; background: #f3f7f4;
}
.card {
  width: 100%; max-width: 420px; background: white; padding: 30px;
  border-radius: 18px; box-shadow: 0 10px 30px #0001;
}
h1 { text-align: center; color: #065f46; }
p { text-align: center; color: #64746c; }
label { display: block; margin: 17px 0 7px; font-weight: bold; }
input {
  width: 100%; padding: 13px; border: 1px solid #ccc;
  border-radius: 9px; font-size: 16px;
}
button {
  width: 100%; margin-top: 22px; padding: 14px; border: 0;
  border-radius: 9px; background: #065f46; color: white;
  font-size: 16px; font-weight: bold; cursor: pointer;
}
#message { margin-top: 15px; font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <h1>GradeX</h1>
  <p>Welcome back! Log in to continue learning.</p>

  <form id="loginForm">
    <label for="phone">Registered phone number</label>
    <input id="phone" type="tel" placeholder="07XXXXXXXX"
           autocomplete="tel" required>

    <label for="password">Password</label>
    <input id="password" type="password"
           autocomplete="current-password" required>

    <button id="loginButton" type="submit">Log In</button>
    <div id="message" role="status"></div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ahvzvrtckmvmuunqzsbd.supabase.co";
const SUPABASE_KEY = "sb_publishable_b8-uNT9cXOH2kVAULMp14w_3b62Le0A";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function formatPhone(value) {
  let phone = value.replace(/[\s()-]/g, "");
  if (phone.startsWith("0")) phone = "+254" + phone.slice(1);
  if (phone.startsWith("254")) phone = "+" + phone;
  return phone;
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  button.disabled = true;
  button.textContent = "Logging in...";
  message.textContent = "";

  const phone = formatPhone(document.getElementById("phone").value.trim());
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      phone: phone,
      password: password
    });

    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Login successful!";

    window.location.href = "./index.html";

  } catch (error) {
    message.style.color = "red";
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "Log In";
  }
});
</script>
</body>
</html>
