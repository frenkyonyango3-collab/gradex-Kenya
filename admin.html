<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeX Admin</title>
<style>
body{font-family:Arial;background:#0f5c2e;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{background:#0f5c2e;color:white;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🔐 GradeX Admin</h2>
<input type="password" id="pass" placeholder="Weka Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
</div>
<script>
function login(){
  let p = document.getElementById('pass').value;
  if(p === 'admin123'){
    localStorage.setItem('isAdmin','true');
    alert('Karibu Admin!');
    window.location.href = 'index.html';
  }else{
    document.getElementById('msg').innerText = 'Password sio sahihi! Jaribu: admin123';
  }
}
</script>
</body>
</html>
